[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pero-ocr"
version = "0.7.0"
description = "Toolkit for advanced OCR of poor quality documents"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["OCR", "Layout analysis", "handwriting recognition"]

authors = [
  {email = "hradis@fit.vutbr.cz", name = "Michal Hradiš"}
]
maintainers = [
  {email = "ibenes@fit.vutbr.cz", name = "Karel Beneš"}
]

classifiers=[
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

# Open ranges for downstream users, spanning what the live workers run (issue #94, "Stable dependency basis").
# The exact versions the tests and the Docker image use are pinned in requirements/lock.txt. Upper bounds are set only
# where a newer release is known to change the results or is not evaluated yet (#99).
dependencies = [
    "numpy>=1.21,<2",
    "opencv-python>=4.5,<5",
    "lxml>=4.7",
    "lmdb>=1.3",
    "levenshtein>=0.17",
    "scipy>=1.5",
    "numba>=0.55",
    "torch>=2.4",
    "torchvision>=0.19",
    "brnolm>=0.2",
    "scikit-learn>=1.0",
    "scikit-image>=0.19",
    "shapely>=1.8,<2.1",  # shapely 2.1 changes the layout polygons (#94); evaluate in #99
    "safe-gpu>=1.5.1",
    "arabic_reshaper>=2.1",
    "ultralytics",
    "music21"
]


[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
homepage = "https://pero.fit.vutbr.cz/"
repository = "https://github.com/DCGM/pero-ocr"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"pero_ocr" = "pero_ocr"
"pero_ocr.user_scripts" = "user_scripts"

[project.scripts]
compare-page-xml-texts = "pero_ocr.user_scripts.compare_page_xml_texts:main"
merge-ocr-results = "pero_ocr.user_scripts.merge_ocr_results:main"
parse-folder = "pero_ocr.user_scripts.parse_folder:main"
select-embed-id = "pero_ocr.user_scripts.select_embed_id:main"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not gpu and not models and not regression'"
markers = [
    "gpu: needs a CUDA device",
    "models: needs real (non-tiny) models, located through PERO_TEST_MODELS",
    "regression: needs the external page sample, located through PERO_TEST_DATA",
    "slow: takes more than a few seconds",
]
