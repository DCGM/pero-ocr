[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pero-ocr"
version = "0.7.0"
description = "Toolkit for advanced OCR of poor quality documents"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = ["OCR", "Layout analysis", "handwriting recognition"]

authors = [
  {email = "hradis@fit.vutbr.cz", name = "Michal Hradiš"}
]
maintainers = [
  {email = "ibenes@fit.vutbr.cz", name = "Karel Beneš"}
]

classifiers=[
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]

# Ranges for using pero-ocr as a dependency of other projects. To run pero-ocr on its own, install requirements/lock.txt:
# the tested basis (Python 3.8 to 3.10, issue #94). These ranges are that lock loosened: lower bounds are the oldest
# releases known to give the lock's results, upper bounds exist only for releases known to change results or not to
# install. Everything else is open.
dependencies = [
    "numpy>=1.21,<2.5",  # 2.5 returns complex eigenvectors from linalg.eig, which DETECT_STRAIGHT_LINES_IN_REGIONS cannot use (TypeError, #97); only reachable on Python >= 3.11
    "opencv-python>=4.11,<5",  # 4.5.5 changes the line crops slightly (#94); 5.x changes them by about a grey level (cv2.remap) and fails the frozen line-cropper check, the OCR changes only at noise level (#99)
    "lxml>=4.7",
    "lmdb>=1.3",
    "lmdb<2; python_version < '3.9'",  # lmdb 2 does not build on Python 3.8 but does not declare it
    "levenshtein>=0.17",
    "scipy>=1.10,<2",  # scipy < 1.8 cannot read logits files written with a newer scipy (#94); 1.10 is the oldest tested; 2.0 removes scipy.ndimage.morphology/measurements, which the layout imports (#97)
    "numba>=0.55",
    "torch>=2.4,<2.14",  # 2.14 (cuDNN 9.24) makes the LAYOUT_CNN layout slightly worse (fewer lines found, more on some GPUs than others); 2.4 to 2.13 change it only at noise level (#99)
    "torchvision>=0.19",
    "brnolm>=0.2",
    "scikit-learn>=1.0",
    "scikit-image>=0.19",
    "shapely>=1.8,<2.1",  # 2.1 moves region and line polygons of LAYOUT_CNN (production config included) and RETRACE_REGIONS by up to a few pixels, same layout quality; it fails the frozen checks (#94, #99)
    "safe-gpu>=1.5.1",
    "arabic_reshaper>=2.1.3",  # 2.1.0 does not build with current setuptools
    "ultralytics>=8.4",
    "music21>=8.3"
]


[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
homepage = "https://pero.fit.vutbr.cz/"
repository = "https://github.com/DCGM/pero-ocr"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-dir]
"pero_ocr" = "pero_ocr"
"pero_ocr.user_scripts" = "user_scripts"

[project.scripts]
compare-page-xml-texts = "pero_ocr.user_scripts.compare_page_xml_texts:main"
merge-ocr-results = "pero_ocr.user_scripts.merge_ocr_results:main"
parse-folder = "pero_ocr.user_scripts.parse_folder:main"
select-embed-id = "pero_ocr.user_scripts.select_embed_id:main"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not gpu and not models and not regression'"
markers = [
    "gpu: needs a CUDA device",
    "models: needs real (non-tiny) models, located through PERO_TEST_MODELS",
    "regression: needs the external page sample, located through PERO_TEST_DATA",
    "slow: takes more than a few seconds",
]
